name: HomelabGlance

options:
  bundleIdPrefix: dev.ponderance
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2KBQH7KWT   # personal team "Anmol Saxena" — 10-char Team ID, survives `xcodegen generate`

targets:

  # ── Shared framework: models, networking, theme, settings ──────────────────
  GlanceKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GlanceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.GlanceKit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # ── Multiplatform app (iOS / iPadOS / macOS) ───────────────────────────────
  HomelabGlance:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - target: GlanceKit
      - target: HomelabGlanceWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.homelabglance
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HomelabGlance.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Both iOS (Frameworks next to exec) and macOS (../Frameworks) rpaths,
        # since this is one multiplatform target.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../Frameworks"

  # ── WidgetKit extension (SCAFFOLD ONLY — placeholder content) ───────────────
  HomelabGlanceWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
    dependencies:
      - target: GlanceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.homelabglance.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/HomelabGlanceWidgets.entitlements

  # ── Unit tests for GlanceKit model decoding ─────────────────────────────────
  GlanceKitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GlanceKitTests
    dependencies:
      - target: GlanceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.GlanceKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HomelabGlance:
    build:
      targets:
        HomelabGlance: all
    run:
      config: Debug
    test:
      targets:
        - GlanceKitTests
  GlanceKit:
    build:
      targets:
        GlanceKit: all
    test:
      targets:
        - GlanceKitTests
