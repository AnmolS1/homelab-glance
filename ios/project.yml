name: HomelabGlance

options:
  bundleIdPrefix: dev.ponderance
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G2KBQH7KWT   # personal team "Anmol Saxena" — 10-char Team ID, survives `xcodegen generate`

targets:

  # ── Shared framework: models, networking, theme, settings ──────────────────
  GlanceKit:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GlanceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.GlanceKit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # ── Multiplatform app (iOS / iPadOS / macOS) ───────────────────────────────
  HomelabGlance:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # The widget AppIntents/entities are compiled into the app too so the app
      # bundle's AppIntents metadata contains them. macOS resolves an interactive
      # widget intent against the APP bundle (chronod), unlike iOS which
      # resolves it in the extension.
      - path: SharedIntents
    dependencies:
      - target: GlanceKit
      - target: HomelabGlanceWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.homelabglance
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HomelabGlance.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        # Both iOS (Frameworks next to exec) and macOS (../Frameworks) rpaths,
        # since this is one multiplatform target.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../Frameworks"

  # ── WidgetKit extension ──────────────────────────────────────────────────────
  HomelabGlanceWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
      # Same intent sources as the app; the widget's configuration/intents use
      # this copy and its metadata is extracted into the appex (needed on iOS).
      - path: SharedIntents
    dependencies:
      - target: GlanceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.homelabglance.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/HomelabGlanceWidgets.entitlements
        # The widget extension links GlanceKit but the framework is embedded in the
        # PARENT app bundle, not the appex. It must find it via rpath or it crashes
        # at launch (dyld "Library not loaded: @rpath/GlanceKit.framework") and the
        # widget renders blank. The appex nests deeper than the app, so the search
        # paths differ per platform:
        #   iOS:   App.app/PlugIns/W.appex/W          → ../../Frameworks
        #   macOS: App.app/Contents/PlugIns/W.appex/Contents/MacOS/W → ../../../../Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - "@loader_path/Frameworks"
          - "@loader_path/../../Frameworks"
          - "@loader_path/../../../../Frameworks"

  # ── Unit tests for GlanceKit model decoding ─────────────────────────────────
  GlanceKitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GlanceKitTests
    dependencies:
      - target: GlanceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ponderance.GlanceKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HomelabGlance:
    build:
      targets:
        HomelabGlance: all
    run:
      config: Debug
    test:
      targets:
        - GlanceKitTests
  GlanceKit:
    build:
      targets:
        GlanceKit: all
    test:
      targets:
        - GlanceKitTests
