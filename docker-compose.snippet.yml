# Standalone compose snippet for the homelab-glance aggregator.
# In production this service can be merged into an existing docker-compose.yml.
# Copy this block, create a .env file from .env.example, and adjust the build
# path to point at this repo's aggregator/ directory.
#
# The volume below mounts your data drive read-only so the aggregator can read
# disk usage directly without modifying your Beszel agent setup. Adjust the
# host path (/your/data/drive) to match your actual mount point.

services:
  glance:
    image: homelab-glance
    build: ./homelab-glance/aggregator
    container_name: glance
    env_file: .env
    environment:
      - TZ=America/Chicago
      - PUID=1000
      - PGID=1000
    volumes:
      - /your/data/drive:/host/expansion:ro
    ports:
      - 8765:8765
    restart: unless-stopped
